<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị - Sổ Nhà Nông</title>
<style>
  body{ font-family: Arial, sans-serif; background:#171310; color:#EDE3D3; margin:0; padding:20px; }
  h1{ color:#D4A72C; font-size:20px; }
  .box{ max-width:420px; margin:60px auto; background:#211C17; padding:24px; border-radius:12px; }
  input{ width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #463B2C; background:#2C251D; color:#EDE3D3; box-sizing:border-box; }
  button{ width:100%; padding:12px; border-radius:8px; border:none; background:#D4A72C; color:#171310; font-weight:600; cursor:pointer; margin-top:10px; }
  .err{ color:#e05252; font-size:13px; margin-top:6px; }
  table{ width:100%; border-collapse:collapse; margin-top:16px; }
  th, td{ padding:10px; text-align:left; border-bottom:1px solid #463B2C; font-size:13px; }
  th{ color:#D4A72C; }
  .badge{ padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; }
  .badge-paid{ background:#2d4a2d; color:#7fce7f; }
  .badge-trial{ background:#4a3a1d; color:#D4A72C; }
  .badge-expired{ background:#4a2020; color:#e07a7a; }
  .btn-toggle{ padding:6px 10px; font-size:12px; width:auto; margin:0; }
  #adminBox{ max-width:100%; margin:0; }
  .search{ margin-bottom:10px; }
</style>
</head>
<body>

<div id="loginBox" class="box">
  <h1>🔐 Quản trị Sổ Nhà Nông</h1>
  <input id="adminEmail" type="email" placeholder="Email quản trị">
  <input id="adminPass" type="password" placeholder="Mật khẩu">
  <button onclick="doAdminLogin()">Đăng nhập</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="adminBox" style="display:none;">
  <h1>🔐 Quản trị Sổ Nhà Nông</h1>
  <input id="searchBox" class="search" placeholder="Tìm theo tên cửa hàng, SĐT..." oninput="renderStores()">
  <table>
    <thead>
      <tr><th>Cửa hàng</th><th>SĐT</th><th>Bắt đầu dùng</th><th>Trạng thái</th><th></th></tr>
    </thead>
    <tbody id="storeRows"></tbody>
  </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAvmg4IDMewdN4GZdy0Z-iYqZXSh67gi5I",
  authDomain: "so-nha-nong.firebaseapp.com",
  projectId: "so-nha-nong",
  storageBucket: "so-nha-nong.firebasestorage.app",
  messagingSenderId: "854860818407",
  appId: "1:854860818407:web:888bfc0564d69d97ab7f42"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const functionsInstance = firebase.app().functions('us-central1');

const ADMIN_UID = "1T9haVRTPohU8QlEFnefVJ9SYk02";
let allStores = [];

function doAdminLogin(){
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPass').value;
  document.getElementById('loginErr').textContent = '';
  auth.signInWithEmailAndPassword(email, pass).catch(e => {
    document.getElementById('loginErr').textContent = 'Đăng nhập thất bại: ' + e.message;
  });
}

auth.onAuthStateChanged(user => {
  if (user && user.uid === ADMIN_UID){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('adminBox').style.display = 'block';
    loadStores();
  } else if (user){
    document.getElementById('loginErr').textContent = 'Tài khoản này không có quyền quản trị.';
    auth.signOut();
  } else {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('adminBox').style.display = 'none';
  }
});

function loadStores(){
  db.collection('stores').get().then(snap => {
    allStores = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStores();
  }).catch(e => alert('Lỗi tải danh sách: ' + e.message));
}

function money(n){ return (n||0).toLocaleString('vi-VN') + 'đ'; }

function renderStores(){
  const keyword = document.getElementById('searchBox').value.trim().toLowerCase();
  const filtered = allStores.filter(s =>
    (s.storeName||'').toLowerCase().includes(keyword) ||
    (s.phone||'').toLowerCase().includes(keyword)
  );
  const tbody = document.getElementById('storeRows');
  tbody.innerHTML = filtered.map(s => {
    const isPaid = s.paid === true;
    const trialStart = s.trialStartAt && s.trialStartAt.toDate ? s.trialStartAt.toDate() : null;
    const daysUsed = trialStart ? Math.floor((new Date() - trialStart) / (1000*60*60*24)) : 0;
    let statusHtml = '';
    if (isPaid){
      statusHtml = '<span class="badge badge-paid">Đã kích hoạt</span>';
    } else if (daysUsed > 5){
      statusHtml = '<span class="badge badge-expired">Hết hạn dùng thử</span>';
    } else {
      statusHtml = '<span class="badge badge-trial">Dùng thử ngày ' + daysUsed + '/5</span>';
    }
    return `
      <tr>
        <td>${s.storeName || '(chưa đặt tên)'}</td>
        <td>${s.phone || ''}</td>
        <td>${trialStart ? trialStart.toLocaleDateString('vi-VN') : '-'}</td>
        <td>${statusHtml}</td>
        <td>
          <button class="btn-toggle" onclick="togglePaid('${s.id}', ${!isPaid})">
            ${isPaid ? 'Huỷ kích hoạt' : 'Kích hoạt'}
          </button>
          <button class="btn-toggle" style="background:#8a3a3a; color:#fff; margin-left:4px;" onclick="resetPassword('${s.id}', '${(s.storeName||'').replace(/'/g,"\\'")}')">
            Đặt lại MK
          </button>
        </td>
      </tr>
    `;
  }).join('');
}

function togglePaid(storeId, newValue){
  if (!confirm(newValue ? 'Xác nhận KÍCH HOẠT (đã trả phí) cho cửa hàng này?' : 'Xác nhận HUỶ kích hoạt (chuyển về trạng thái dùng thử)?')) return;
  db.collection('stores').doc(storeId).update({ paid: newValue }).then(() => {
    loadStores();
  }).catch(e => alert('Lỗi: ' + e.message));
}
function resetPassword(storeId, storeName){
  const newPass = prompt('Nhập mật khẩu MỚI cho cửa hàng "' + storeName + '" (tối thiểu 6 ký tự):');
  if (!newPass) return;
  if (newPass.length < 6){ alert('Mật khẩu cần tối thiểu 6 ký tự.'); return; }
  if (!confirm('Xác nhận đặt mật khẩu mới cho "' + storeName + '"?')) return;

  const resetFn = functionsInstance.httpsCallable('resetShopPassword');
  resetFn({ storeId, newPassword: newPass }).then(() => {
    alert('Đặt lại mật khẩu thành công! Mật khẩu mới: ' + newPass + '\n\nBáo lại cho chủ cửa hàng nhé.');
  }).catch(e => {
    alert('Lỗi: ' + e.message);
  });
}
</script>
</body>
</html>
